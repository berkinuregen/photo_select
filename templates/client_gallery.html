{% extends "base.html" %}
{% block title %}Fotoğraf Seçiminiz · Atölye{% endblock %}
{% block content %}
<header class="container py-6 border-b border-stone-800"><span class="brand">ATÖLYE <span class="text-stone-500">/ PROOFING</span></span></header>
<main class="container pt-12 pb-40" id="gallery" data-token="{{ token }}">
  <p class="eyebrow">SİZE ÖZEL GALERİ</p>
  <h1 id="title" class="display mt-4">Galeriniz yükleniyor...</h1>
  <p id="description" class="muted mt-4 max-w-2xl whitespace-pre-line"></p>
  <div class="flex justify-between items-end gap-4 mt-12 mb-5"><p class="section-heading">FOTOĞRAFLARINIZ</p><p class="text-xs text-stone-500">Büyütmek için fotoğrafa dokunun</p></div>
  <div id="photos" class="photo-grid"></div>
</main>
<div class="bottom-bar">
  <div class="container flex items-center justify-between gap-4">
    <div><p class="eyebrow">SEÇİMLERİNİZ</p><p id="counter" class="mt-1 text-sm sm:text-base">Yükleniyor...</p></div>
    <button id="submit" class="button button-light text-sm" disabled>Seçimi tamamla <span aria-hidden="true">→</span></button>
  </div>
</div>
<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Fotoğraf önizlemesi">
  <button id="lightbox-close" class="lightbox-close" aria-label="Kapat">×</button>
  <button id="lightbox-prev" class="lightbox-nav left-2" aria-label="Önceki fotoğraf">‹</button>
  <img id="lightbox-image" alt="">
  <button id="lightbox-next" class="lightbox-nav right-2" aria-label="Sonraki fotoğraf">›</button>
  <div class="lightbox-footer"><p id="lightbox-name" class="truncate"></p><button id="lightbox-select" class="button button-light text-sm"></button></div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/client.js" defer></script>{% endblock %}
