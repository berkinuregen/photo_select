{% extends "base.html" %}
{% block title %}Yönetici Girişi · Atölye{% endblock %}
{% block content %}
<main class="login-layout">
  <section class="login-card">
    <div class="brand mb-10"><span class="brand-mark">A</span> ATÖLYE <span class="brand-sub">/ STÜDYO</span></div>
    <p class="eyebrow"><span class="accent-dot"></span> YÖNETİM PANELİ</p>
    <h1 class="display mt-5">Hoş <em>geldiniz.</em></h1>
    <p class="muted mt-3">Galerilerinizi yönetmek için giriş yapın.</p>
    <form id="login-form" class="mt-10 space-y-5">
      <label class="block text-sm" for="password">Yönetici parolası</label>
      <input id="password" class="input" type="password" required autocomplete="current-password">
      <button class="button button-light w-full" type="submit">Giriş yap <span aria-hidden="true">→</span></button>
    </form>
  </section>
</main>
{% endblock %}
{% block scripts %}<script src="/static/login.js" defer></script>{% endblock %}
